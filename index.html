<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NYC MTA Live Bus Tracker - All Boroughs</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body, html {
            width: 100%; height: 100%;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            overscroll-behavior: none;
        }

        #container { width: 100%; height: 100%; display: flex; }
        #map { flex: 1; }

        .info-panel {
            width: 340px;
            background: white;
            padding: 24px;
            overflow-y: auto;
            box-shadow: -2px 0 12px rgba(0,0,0,0.08);
            z-index: 1000;
        }

        .info-panel h1 { font-size: 22px; color: #1a1a1a; margin-bottom: 8px; font-weight: 600; }
        .subtitle { font-size: 14px; color: #666; margin-bottom: 4px; }

        .stats { background: #f8f9fa; padding: 9px 16px; border-radius: 8px; margin-bottom: 16px; }
        .stat-item { display: flex; justify-content: space-between; margin: 10px 0; font-size: 15px; }
        .stat-label { color: #666; }
        .stat-value { font-weight: 600; color: #2563eb; }

        .borough-section { margin-bottom: 24px; }
        .borough-section h3 {
            font-size: 13px; color: #999; margin-bottom: 12px;
            text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600;
        }

        .borough-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px; background: #f8f9fa; border-radius: 6px;
            margin-bottom: 8px; cursor: pointer; transition: all 0.2s;
        }
        .borough-header:hover { background: #e9ecef; }
        .borough-name { display: flex; align-items: center; font-weight: 600; font-size: 14px; }
        .borough-dot { width: 14px; height: 14px; border-radius: 50%; margin-right: 10px; }
        .borough-count { font-weight: 600; color: #666; font-size: 14px; }

        .route-list { margin-left: 0; margin-bottom: 8px; overflow: hidden; max-height: 0; transition: max-height 0.25s ease-out; }
        .route-list.open { max-height: 5000px; transition: max-height 0.35s ease-in; }

        .route-item {
            display: flex; justify-content: space-between;
            padding: 5px 12px 5px 36px; font-size: 13px; color: #666;
            cursor: pointer; border-radius: 4px; transition: background 0.15s;
        }
        .route-item:hover { background: #f3f4f6; color: #111; }

        .borough-chevron { font-size: 11px; color: #aaa; transition: transform 0.25s ease; margin-left: 8px; }
        .borough-header.open .borough-chevron { transform: rotate(180deg); }

        .last-update { margin-top: 24px; padding-top: 16px; border-top: 1px solid #e5e7eb; font-size: 12px; color: #999; }

        /* Bus marker labels */
        .bus-label {
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
        }

        /* Drag handle (mobile) */
        .drag-handle-area { display: none; }
        .drag-handle-bar { width: 40px; height: 4px; background: #d1d5db; border-radius: 2px; transition: background 0.2s; }
        .drag-handle-area:active .drag-handle-bar,
        .drag-handle-area.dragging .drag-handle-bar { background: #9ca3af; }

        .panel-title-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }

        @media (max-width: 768px) {
            #container { flex-direction: column; position: relative; }
            #map { flex: 1; order: 1; height: 100%; }

            .info-panel {
                position: absolute; bottom: 0; left: 0; right: 0; width: 100%;
                order: 2; padding: 0 18px 20px 18px;
                border-radius: 16px 16px 0 0;
                box-shadow: 0 -4px 24px rgba(0,0,0,0.12);
                overflow-y: hidden; overflow-x: hidden;
                transition: transform 0.32s cubic-bezier(0.4, 0, 0.2, 1);
                transform: translateY(0); will-change: transform; visibility: hidden;
            }
            .panel-collapsible { overflow-y: auto; }
            .drag-handle-area {
                display: flex; align-items: center; justify-content: center;
                width: calc(100% + 36px); margin: 0 -18px; padding: 8px 0 14px;
                cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none;
            }
            .drag-handle-area:active { cursor: grabbing; }
            .panel-title-row { margin-bottom: 6px; }
            .info-panel h1 { font-size: 18px; margin-bottom: 0; }

            .leaflet-bottom { bottom: auto !important; top: 0 !important; }
        }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        #last-update.loading { animation: blink 1.2s ease-in-out infinite; }
    </style>
</head>
<body>
<div id="container">
    <div id="map"></div>

    <div class="info-panel" id="info-panel">
        <div class="drag-handle-area" id="drag-handle-area">
            <div class="drag-handle-bar"></div>
        </div>

        <div class="panel-always-visible">
            <div class="panel-title-row">
                <h1>NYC Live MTA Bus Tracker</h1>
            </div>
            <div class="subtitle">Updates every 45 seconds (Data source: <a href="https://bustime.mta.info/wiki/Developers/Index" target="_blank" rel="noopener noreferrer" style="color: #1e40af;">MTA Bus Time API</a>)</div>
            <div class="last-update" style="margin-top: 0; margin-bottom: 0; padding-top: 0; border-top: none;">
                Last updated: <strong id="last-update">Initial load takes up to 45 seconds...</strong>
            </div>
            <div style="font-size: 12px; color: #2563eb; margin-top: 3px; margin-bottom: 0; line-height: 1.3;" id="hint-text">
                Hover or tap on bus on map for details
            </div>
        </div>

        <div class="panel-collapsible">
            <div id="bus-detail" style="display: none; margin-top: 12px; margin-bottom: 16px; padding: 12px; background: #f8f9fa; border-radius: 8px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                    <div id="bus-detail-route" style="font-size: 18px; font-weight: 600;"></div>
                    <div id="bus-detail-borough" style="font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: #9ca3af; font-weight: 500;"></div>
                    <button onclick="clearBusDetail()" style="background: none; border: none; font-size: 18px; color: #6b7280; cursor: pointer;">✕</button>
                </div>
                <div style="font-size: 11px; color: #6b7280; margin-bottom: 2px;">To</div>
                <div id="bus-detail-destination" style="font-size: 13px; font-weight: 500; color: #1f2937; margin-bottom: 8px;"></div>
                <div style="font-size: 11px; color: #6b7280; margin-bottom: 2px;">Bus</div>
                <div id="bus-detail-vehicle" style="font-size: 13px; font-weight: 500; color: #1f2937; margin-bottom: 8px;"></div>
                <div id="bus-detail-stops-section" style="display: none;">
                    <div style="font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: #9ca3af; font-weight: 500; margin-bottom: 4px;">Next Stops</div>
                    <ol id="bus-detail-stops" style="margin: 0; padding-left: 18px; font-size: 11px; color: #6b7280; line-height: 1.5;"></ol>
                </div>
            </div>

            <div style="margin-top: 12px;"></div>
            <div class="stats">
                <div class="stat-item">
                    <span class="stat-label">Active Buses</span>
                    <span class="stat-value" id="bus-count">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Total Routes</span>
                    <span class="stat-value" id="route-count">0</span>
                </div>
            </div>

            <div class="borough-section">
                <h3>Service Route</h3>
                <div style="font-size: 12px; color: #2563eb; margin-top: -8px; margin-bottom: 12px; line-height: 1.3;">
                    Select bus from dropdown to find on map
                </div>
                <div id="borough-list"></div>
            </div>
        </div>
    </div>
</div>

<script>
// =====================================================
//  MOBILE DRAG HANDLE
// =====================================================
(function () {
    const isMobile = () => window.innerWidth <= 768;
    if (!isMobile()) return;

    const panel      = document.getElementById('info-panel');
    const handleArea = document.getElementById('drag-handle-area');
    const PANEL_VH   = 88;
    const SNAP_COUNT = 3;
    const TRANSITION = 'transform 0.35s cubic-bezier(0.4, 0, 0.2, 1)';

    let snapIndex   = 1;
    let snapOffsets = [0, 0, 0];

    function alwaysVisibleHeight() {
        const alwaysVisible = panel.querySelector('.panel-always-visible');
        if (alwaysVisible) return handleArea.offsetHeight + alwaysVisible.offsetHeight;
        return handleArea.offsetHeight + 130;
    }

    function computeOffsets() {
        const panelPx   = window.innerHeight * PANEL_VH / 100;
        const midExpose = window.innerHeight * 40 / 100;
        const avh = alwaysVisibleHeight();
        snapOffsets[2] = 0;
        snapOffsets[1] = panelPx - midExpose;
        snapOffsets[0] = panelPx - avh + 40;
        if (snapOffsets[0] < snapOffsets[1]) snapOffsets[0] = snapOffsets[1];
    }

    function updateCollapsible() {
        const collapsible = panel.querySelector('.panel-collapsible');
        if (!collapsible) return;
        const panelPx   = window.innerHeight * PANEL_VH / 100;
        const reservedH = alwaysVisibleHeight() + 20;
        const available = Math.max(0, panelPx - reservedH);
        collapsible.style.height    = available + 'px';
        collapsible.style.maxHeight = available + 'px';
        collapsible.style.overflowY = 'auto';
    }

    function applySnap(index, animate) {
        snapIndex = Math.max(0, Math.min(SNAP_COUNT - 1, index));
        panel.style.transition = animate ? TRANSITION : 'none';
        panel.style.transform = `translateY(${snapOffsets[snapIndex]}px)`;
        updateCollapsible();
        if (!animate) requestAnimationFrame(() => { panel.style.transition = ''; });
    }

    window.addEventListener('load', () => {
        setTimeout(() => {
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    panel.style.height = PANEL_VH + 'vh';
                    panel.style.overflowY = 'hidden';
                    computeOffsets();
                    console.log('panelPx:', window.innerHeight * 88 / 100, 'midExpose:', window.innerHeight * 40 / 100, 'avh:', alwaysVisibleHeight());
                    console.log(snapOffsets)
                    updateCollapsible();
                    applySnap(1, false);
                    panel.style.visibility = 'visible';
                });
            });
        }, 100);
    });

    window.addEventListener('resize', () => {
        if (!isMobile()) return;
        computeOffsets();
        applySnap(snapIndex, false);
    });

    let dragging = false, startY = 0, startOffset = 0, liveOffset = 0, lastY = 0, lastT = 0, velocity = 0;
    const SWIPE_VEL = 0.25, DEAD_ZONE = 6;

    handleArea.addEventListener('touchstart', onStart, { passive: false });
    handleArea.addEventListener('mousedown',  onStart);

    panel.addEventListener('touchstart', (e) => {
        if (handleArea.contains(e.target)) return;
        const collapsible = panel.querySelector('.panel-collapsible');
        if (collapsible && collapsible.contains(e.target)) { if (snapIndex === 0) onStart(e); return; }
        if (snapIndex === 0) { onStart(e); return; }
        if (!collapsible || collapsible.scrollTop <= 0) onStart(e);
    }, { passive: false });

    panel.addEventListener('click', () => { if (!dragging && snapIndex === 0) applySnap(1, true); });

    function onStart(e) {
        map.dragging.disable();
        if (!isMobile()) return;
        e.stopPropagation();
        computeOffsets();
        console.log('snapOffsets:', snapOffsets, 'avh:', alwaysVisibleHeight(), 'panelPx:', window.innerHeight * PANEL_VH / 100);
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        startY = clientY; startOffset = snapOffsets[snapIndex]; liveOffset = startOffset;
        lastY = clientY; lastT = Date.now(); velocity = 0; dragging = false;
        panel.style.transition = 'none';
        handleArea.classList.add('dragging');
        document.addEventListener('touchmove', onMove, { passive: false });
        document.addEventListener('touchend',  onEnd,  { passive: true });
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup',   onEnd);
    }

    function onMove(e) {
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        if (!dragging) { if (Math.abs(clientY - startY) < DEAD_ZONE) return; dragging = true; }
        e.preventDefault();
        const now = Date.now();
        velocity = (clientY - lastY) / Math.max(1, now - lastT);
        lastY = clientY; lastT = now;
        liveOffset = Math.max(snapOffsets[2], Math.min(snapOffsets[0], startOffset + (clientY - startY)));
        panel.style.transform = `translateY(${liveOffset}px)`;
    }

    function onEnd() {
        map.dragging.enable();
        handleArea.classList.remove('dragging');
        document.removeEventListener('touchmove', onMove);
        document.removeEventListener('touchend',  onEnd);
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup',   onEnd);
        if (!dragging) { dragging = false; return; }
        dragging = false;
        let target = snapIndex;
        if (velocity > SWIPE_VEL) target = Math.max(0, snapIndex - 1);
        else if (velocity < -SWIPE_VEL) target = Math.min(SNAP_COUNT - 1, snapIndex + 1);
        else { let minDist = Infinity; snapOffsets.forEach((o, i) => { const d = Math.abs(liveOffset - o); if (d < minDist) { minDist = d; target = i; } }); }
        applySnap(target, true);
    }

    window._recomputeSnaps = () => { computeOffsets(); applySnap(snapIndex, false); };
})();

// =====================================================
//  MAP + BUS TRACKER (Leaflet)
// =====================================================
const isTouchDevice = () => navigator.maxTouchPoints > 0;

window.addEventListener('load', () => {
    const hint = document.getElementById('hint-text');
    if (hint) hint.textContent = isTouchDevice()
        ? 'Tap a bus for details'
        : 'Hover on bus for preview · Click to lock · Click map or X to dismiss';
});

const boroughColors = {
    'Manhattan':    '#1e40af',
    'Bronx':        '#2563eb',
    'Queens':       '#3b82f6',
    'Brooklyn':     '#60a5fa',
    'Staten Island':'#93c5fd',
    'Express':      '#8b5cf6',
    'Unknown':      '#6b7280'
};

// ── Leaflet map ──────────────────────────────────────
const map = L.map('map', {
    center: [40.73, -73.98],
    zoom: 12,
    zoomControl: true,
    wheelPxPerZoomLevel: 300
});

L.tileLayer('https://api.mapbox.com/styles/v1/mapbox/light-v11/tiles/{z}/{x}/{y}?access_token=pk.eyJ1IjoiYmlvcGl4aWUiLCJhIjoiY21saGcyMHlsMDhtcjNkb205bTVtcDNraSJ9.QW9C9Oatp3hcGYvWfrD84g', {
    attribution: '&copy; <a href="https://www.mapbox.com/">Mapbox</a> &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
    tileSize: 512,
    zoomOffset: -1,
    maxZoom: 19,
    fadeAnimation: false
}).addTo(map);

// ── State ────────────────────────────────────────────
const busMarkers  = new Map();  // vehicleId → { marker, route, busData }
const EXPIRY_MS   = 5 * 60 * 1000;
let currentFetchId = 0, lastCompletedFetchId = 0;
let selectedRoute    = null;
let selectedVehicleId = null;

// ── Route lines & bus stops layers ───────────────────
// Source data stored once after fetch
let routeGeoJSON = null;
let stopsGeoJSON = null;
let routeLayer   = null;
let stopsLayer   = null;

fetch('https://raw.githubusercontent.com/PrincessBari/mta_all_nyc_buses/multiline-routes/routes.geojson?v=3')
    .then(r => r.json())
    .then(geojson => { routeGeoJSON = geojson; console.log('Route shapes loaded'); })
    .catch(err => console.error('Failed to load route shapes:', err));

fetch('https://raw.githubusercontent.com/PrincessBari/mta_all_nyc_buses/refs/heads/add_bus_stops/stops.geojson')
    .then(r => r.json())
    .then(geojson => { stopsGeoJSON = geojson; console.log('Bus stops loaded'); })
    .catch(err => console.error('Failed to load bus stops:', err));

// ── Show/hide route & stops ───────────────────────────
function showRoute(routeId, color) {
    if (routeLayer) { map.removeLayer(routeLayer); routeLayer = null; }
    if (stopsLayer) { map.removeLayer(stopsLayer); stopsLayer = null; }

    if (routeGeoJSON) {
        const filtered = {
            type: 'FeatureCollection',
            features: routeGeoJSON.features.filter(f => f.properties.route_id === routeId)
        };
        routeLayer = L.geoJSON(filtered, {
            style: { color, weight: 3, opacity: 0.8 }
        }).addTo(map);
    }

    if (stopsGeoJSON) {
        const filtered = {
            type: 'FeatureCollection',
            features: stopsGeoJSON.features.filter(f => f.properties.route_id === routeId)
        };
        stopsLayer = L.geoJSON(filtered, {
            pointToLayer: (feature, latlng) => L.circleMarker(latlng, {
                radius: 3.5,
                fillColor: '#ffffff',
                fillOpacity: 0.9,
                color: color,
                weight: 2,
                opacity: 1
            })
        }).addTo(map);
    }
}

function hideRoute() {
    if (routeLayer) { map.removeLayer(routeLayer); routeLayer = null; }
    if (stopsLayer) { map.removeLayer(stopsLayer); stopsLayer = null; }
}

// Store source data on layers after load for filtering
fetch('https://raw.githubusercontent.com/PrincessBari/mta_all_nyc_buses/multiline-routes/routes.geojson?v=3')
    .then(r => r.json())
    .then(geojson => {
        if (routeLayer) routeLayer._sourceData = geojson;
    });

fetch('https://raw.githubusercontent.com/PrincessBari/mta_all_nyc_buses/refs/heads/add_bus_stops/stops.geojson')
    .then(r => r.json())
    .then(geojson => {
        if (stopsLayer) stopsLayer._sourceData = geojson;
    });

// ── Unified marker state ──────────────────────────────
// mode: null    → reset all
// mode: 'bus'   → selected bus glows, same-route normal, rest dim
// mode: 'route' → all on route glow, rest dim
function updateMarkerStates(activeRoute, activeVehicleId, mode) {
    busMarkers.forEach((entry, vehicleId) => {
        const el = entry.marker.getElement();
        const inner = el.querySelector('.bus-dot');
        const onRoute = entry.route === activeRoute;

        if (!activeRoute || !mode) {
            el.style.opacity = '1';
            if (inner) { inner.style.boxShadow = '0 1px 2px rgba(0,0,0,0.25)'; inner.style.border = '1px solid white'; }
        } else if (mode === 'route') {
            if (onRoute) {
                el.style.opacity = '1';
                if (inner) { inner.style.boxShadow = '0 0 12px 3px rgba(251,191,36,0.9)'; inner.style.border = '2px solid #fbbf24'; }
            } else {
                el.style.opacity = '0.2';
                if (inner) { inner.style.boxShadow = '0 1px 2px rgba(0,0,0,0.25)'; inner.style.border = '1px solid white'; }
            }
        } else if (mode === 'bus') {
            if (vehicleId === activeVehicleId) {
                el.style.opacity = '1';
                if (inner) { inner.style.boxShadow = '0 0 12px 3px rgba(251,191,36,0.9)'; inner.style.border = '2px solid #fbbf24'; }
            } else if (onRoute) {
                el.style.opacity = '1';
                if (inner) { inner.style.boxShadow = '0 1px 2px rgba(0,0,0,0.25)'; inner.style.border = '1px solid white'; }
            } else {
                el.style.opacity = '0.2';
                if (inner) { inner.style.boxShadow = '0 1px 2px rgba(0,0,0,0.25)'; inner.style.border = '1px solid white'; }
            }
        }
    });
}

// ── Create bus marker element ─────────────────────────
function createBusIcon(color, routeDisplay) {
    let width;
    if (routeDisplay.length <= 2) width = 18;
    else if (routeDisplay.length === 3) width = 22;
    else if (routeDisplay.length === 4) width = 26;
    else width = 30;

    const fontSize = routeDisplay.length >= 4 ? 7 : 9;

    return L.divIcon({
        className: 'bus-label',
        html: `<div class="bus-dot" style="
            width:${width}px; height:18px; border-radius:50%;
            background-color:${color}; border:1px solid white;
            display:flex; align-items:center; justify-content:center;
            color:white; font-size:${fontSize}px; font-weight:600;
            cursor:pointer; box-shadow:0 1px 2px rgba(0,0,0,0.25);
            font-family:'Inter',sans-serif; white-space:nowrap;
        ">${routeDisplay}</div>`,
        iconSize: [width, 18],
        iconAnchor: [width / 2, 9]
    });
}

// ── Bus detail panel ──────────────────────────────────
function showBusDetail(bus, color) {
    document.getElementById('bus-detail-borough').textContent = `Service Route: ${bus.borough}`;
    document.getElementById('bus-detail-route').textContent = bus.route;
    document.getElementById('bus-detail-route').style.color = color;
    document.getElementById('bus-detail-destination').textContent = bus.destination;
    document.getElementById('bus-detail-vehicle').textContent = bus.vehicle_id;

    const stopsSection = document.getElementById('bus-detail-stops-section');
    const stopsList    = document.getElementById('bus-detail-stops');
    if (bus.next_stops && bus.next_stops.length > 0) {
        stopsList.innerHTML = bus.next_stops.map(s => `<li style="margin:2px 0">${s}</li>`).join('');
        stopsSection.style.display = 'block';
    } else {
        stopsSection.style.display = 'none';
    }
    document.getElementById('bus-detail').style.display = 'block';
}

function clearBusDetail() {
    selectedRoute     = null;
    selectedVehicleId = null;
    updateMarkerStates(null, null, null);
    document.getElementById('bus-detail').style.display = 'none';
    hideRoute();
}

// Click on map background → clear
map.on('click', () => { clearBusDetail(); });

// ── Borough / route panel ─────────────────────────────
function toggleBorough(header) {
    const isOpen = header.classList.toggle('open');
    const routeList = header.nextElementSibling;
    if (routeList && routeList.classList.contains('route-list')) {
        routeList.classList.toggle('open', isOpen);
    }
}

// ── Main update loop ──────────────────────────────────
document.getElementById('last-update').classList.add('loading');
updateMap();
function scheduleNext() { setTimeout(() => { updateMap(); scheduleNext(); }, 45000); }
scheduleNext();

document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') updateMap();
});

function updateMap() {
    const fetchId = ++currentFetchId;

    fetch('https://6bzmgql6bejgixjbtk5m2csisi0aaunm.lambda-url.us-east-1.on.aws/')
        .then(r => r.json())
        .then(data => {
            if (fetchId < lastCompletedFetchId) return;
            lastCompletedFetchId = fetchId;

            const parsedData = typeof data.body === 'string' ? JSON.parse(data.body) : data;
            if (!parsedData || !parsedData.buses || parsedData.buses.length === 0) {
                console.warn('Empty bus data — keeping existing markers');
                return;
            }

            const now          = Date.now();
            const buses        = parsedData.buses;
            const boroughCounts = parsedData.borough_counts || {};
            const routeCounts   = parsedData.route_counts   || {};

            buses.forEach(bus => {
                const lat = parseFloat(bus.latitude);
                const lng = parseFloat(bus.longitude);
                if (!bus.route || !lat || !lng || lat === 0 || lng === 0 || isNaN(lat) || isNaN(lng)) return;

                const vehicleId    = bus.vehicle_id;
                const color        = bus.color || boroughColors[bus.borough] || '#6b7280';
                const routeDisplay = String(bus.route).replace('-', '');

                if (busMarkers.has(vehicleId)) {
                    const entry = busMarkers.get(vehicleId);
                    entry.marker.setLatLng([lat, lng]);
                    entry.lastSeen = now;
                    entry.busData  = bus;

                    // Update color on inner dot
                    const inner = entry.marker.getElement()?.querySelector('.bus-dot');
                    if (inner) inner.style.backgroundColor = color;

                    // Re-apply opacity state in case Leaflet touched the element
                    applyEntryOpacity(entry, vehicleId);

                    if (selectedVehicleId === vehicleId) showBusDetail(bus, color);

                } else {
                    const icon   = createBusIcon(color, routeDisplay);
                    const marker = L.marker([lat, lng], { icon, zIndexOffset: 0 }).addTo(map);

                    const entry = { marker, route: bus.route, lastSeen: now, busData: bus, opacity: '1' };
                    busMarkers.set(vehicleId, entry);

                    // Apply current selection state immediately
                    applyEntryOpacity(entry, vehicleId);

                    const el = marker.getElement();

                    if (!isTouchDevice()) {
                        el.addEventListener('mouseenter', () => {
                            if (!selectedRoute) {
                                const currentBus = busMarkers.get(vehicleId)?.busData || bus;
                                showBusDetail(currentBus, color);
                                showRoute(currentBus.route, color);
                            }
                        });
                        el.addEventListener('mouseleave', () => {
                            if (!selectedRoute) clearBusDetail();
                        });
                    }

                    el.addEventListener('click', (e) => {
                        L.DomEvent.stopPropagation(e);
                        const currentBus = busMarkers.get(vehicleId)?.busData || bus;
                        selectedRoute     = currentBus.route;
                        selectedVehicleId = vehicleId;
                        updateMarkerStates(currentBus.route, vehicleId, 'bus');
                        showBusDetail(currentBus, color);
                        showRoute(currentBus.route, color);
                    });

                    if (isTouchDevice()) {
                        el.addEventListener('touchend', (e) => {
                            if (e.touches.length > 0) return;
                            L.DomEvent.stopPropagation(e);
                            const currentBus = busMarkers.get(vehicleId)?.busData || bus;
                            selectedRoute     = currentBus.route;
                            selectedVehicleId = vehicleId;
                            updateMarkerStates(currentBus.route, vehicleId, 'bus');
                            showBusDetail(currentBus, color);
                            showRoute(currentBus.route, color);
                        });
                    }
                }
            });

            // Expire old markers
            busMarkers.forEach((entry, vehicleId) => {
                if (now - entry.lastSeen > EXPIRY_MS) {
                    map.removeLayer(entry.marker);
                    busMarkers.delete(vehicleId);
                }
            });

            document.getElementById('bus-count').textContent = busMarkers.size;
            const uniqueRoutes = new Set();
            Object.keys(routeCounts).forEach(k => uniqueRoutes.add(k.split(':')[1]));
            document.getElementById('route-count').textContent = uniqueRoutes.size;

            // Build borough/route panel
            const boroughList  = document.getElementById('borough-list');
            const boroughOrder = ['Manhattan', 'Bronx', 'Queens', 'Brooklyn', 'Staten Island', 'Express'];
            const openBoroughs = new Set([...document.querySelectorAll('.borough-header.open')].map(el => el.dataset.borough));

            boroughList.innerHTML = boroughOrder.map(borough => {
                const count  = boroughCounts[borough] || 0;
                const color  = boroughColors[borough];
                const isOpen = openBoroughs.has(borough);

                const boroughRoutes = {};
                Object.entries(routeCounts).forEach(([key, cnt]) => {
                    const [b, route] = key.split(':');
                    if (b === borough) boroughRoutes[route] = cnt;
                });

                const routeHTML = Object.entries(boroughRoutes)
                    .sort((a, b) => a[0].localeCompare(b[0], undefined, { numeric: true }))
                    .map(([route, rCount]) => {
                        let routeColor = '#6b7280';
                        busMarkers.forEach(entry => { if (entry.route === route) { const inner = entry.marker.getElement()?.querySelector('.bus-dot'); if (inner) routeColor = inner.style.backgroundColor; } });
                        return `
                        <div class="route-item"
                            onmouseenter="if (!selectedRoute) { updateMarkerStates('${route}', null, 'route'); showRoute('${route}', '${routeColor}'); }"
                            onmouseleave="if (!selectedRoute) { updateMarkerStates(null, null, null); hideRoute(); }"
                            onclick="selectedRoute='${route}'; selectedVehicleId=null; updateMarkerStates('${route}', null, 'route'); showRoute('${route}', '${routeColor}')">
                            <span>${route}</span>
                            <span style="color:#aaa">${rCount}</span>
                        </div>`;
                    }).join('');

                return `
                    <div style="margin-bottom:6px;">
                        <div class="borough-header ${isOpen ? 'open' : ''}"
                             data-borough="${borough}"
                             onclick="toggleBorough(this)"
                             style="cursor:${count > 0 ? 'pointer' : 'default'}">
                            <div class="borough-name">
                                <div class="borough-dot" style="background-color:${color}"></div>
                                ${borough}
                            </div>
                            <div style="display:flex;align-items:center;">
                                <div class="borough-count">${count} buses</div>
                                ${count > 0 ? '<span class="borough-chevron">▼</span>' : ''}
                            </div>
                        </div>
                        ${count > 0 ? `<div class="route-list ${isOpen ? 'open' : ''}">${routeHTML}</div>` : ''}
                    </div>`;
            }).join('');

            const el = document.getElementById('last-update');
            el.classList.remove('loading');
            el.textContent = new Date().toLocaleTimeString();

            // if (window._recomputeSnaps) window._recomputeSnaps();
        })
        .catch(err => console.error(`Fetch #${fetchId} failed:`, err));
}

// ── Apply the stored opacity to a marker entry ────────
// Called both on creation and on every position update
function applyEntryOpacity(entry, vehicleId) {
    if (!selectedRoute) {
        entry.opacity = '1';
    } else if (selectedVehicleId) {
        // bus mode
        if (vehicleId === selectedVehicleId) entry.opacity = '1';
        else if (entry.route === selectedRoute) entry.opacity = '1';
        else entry.opacity = '0.2';
    } else {
        // route mode
        entry.opacity = entry.route === selectedRoute ? '1' : '0.2';
    }
    const el = entry.marker.getElement();
    if (el) el.style.opacity = entry.opacity;
}
</script>
